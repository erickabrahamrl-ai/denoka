<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DENOKA | Films & Design</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para procesar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: white; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        
        // Simulación de iconos de Lucide (usando SVGs directos para asegurar compatibilidad en index.html)
        const Icon = ({ name, className }) => {
            const icons = {
                palette: <path d="M12 20.94c1.88 0 3.05-1.4 3.05-3.11 0-.51-.1-.99-.26-1.42l-1.02-2.82c-.03-.08-.05-.17-.05-.26 0-.41.33-.75.75-.75h.33c.41 0 .75.34.75.75 0 .09-.02.18-.05.26l-1.02 2.82c-.16.43-.26.91-.26 1.42 0 1.71 1.17 3.11 3.05 3.11s3.05-1.4 3.05-3.11c0-2.43-1.63-4.52-3.8-5.32l-1.01-.37c-.39-.14-.59-.59-.45-.98.14-.39.59-.59.98-.45l1.01.37c2.93 1.08 5.12 3.88 5.12 7.15 0 3.09-2.11 5.61-5.05 5.61s-5.05-2.52-5.05-5.61c0-.51.1-.99.26-1.42l1.02-2.82c.03-.08.05-.17.05-.26 0-.41-.33-.75-.75-.75h-.33c-.41 0-.75.34-.75.75 0 .09.02.18.05.26l1.02 2.82c.16.43.26.91.26 1.42 0 1.71-1.17 3.11-3.05 3.11S1.9 19.54 1.9 17.83c0-3.27 2.19-6.07 5.12-7.15l1.01-.37c.39-.14.84.06.98.45.14.39-.06.84-.45.98l-1.01.37c-2.17.8-3.8 2.89-3.8 5.32 0 1.71 1.17 3.11 3.05 3.11zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>,
                camera: <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>,
                video: <path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>,
                users: <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>,
                phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>,
                mail: <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>,
                send: <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>,
                instagram: <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>,
                facebook: <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>,
                tiktok: <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/>,
                chevronRight: <path d="m9 18 6-6-6-6"/>,
                arrowRight: <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>,
                check: <path d="M20 6 9 17l-5-5"/>
            };
            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width="24" height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('inicio');
            const [formData, setFormData] = useState({ name: '', service: '', contact: '' });
            const [showSuccess, setShowSuccess] = useState(false);

            const services = [
                { id: 'identidad', title: 'Identidad de Marca', icon: 'palette', description: 'Creamos el ADN visual de tu empresa. Desde logotipos hasta manuales completos.', features: ['Diseño de Logotipo', 'Paleta de Colores', 'Tipografías', 'Papelería'] },
                { id: 'negocios', title: 'Contenido para Negocios', icon: 'video', description: 'Material audiovisual diseñado para posicionar tu marca en redes sociales.', features: ['Reels & TikToks', 'Videos Corporativos', 'Foto de Producto', 'Publicidad'] },
                { id: 'sociales', title: 'Cobertura de Eventos', icon: 'users', description: 'Inmortalizamos tus momentos con una narrativa cinematográfica única.', features: ['Bodas y XV Años', 'Graduaciones', 'Eventos Sociales', 'After-movies'] },
                { id: 'sesiones', title: 'Sesiones Fotográficas', icon: 'camera', description: 'Capturamos tu mejor ángulo en sesiones profesionales de todo tipo.', features: ['Retrato', 'Lifestyle & Moda', 'Parejas', 'Editorial'] }
            ];

            const socialLinks = [
                { name: 'Instagram', icon: 'instagram', url: 'https://www.instagram.com/denokamx?igsh=MWNucXFtZnEzeng3Mw==' },
                { name: 'TikTok', icon: 'tiktok', url: 'https://www.tiktok.com/@denokamx?_r=1&_t=ZS-95qRymkpeF6' },
                { name: 'Facebook', icon: 'facebook', url: 'https://www.facebook.com/share/1Btyz5jD3r/?mibextid=wwXIfr' },
                { name: 'WhatsApp', icon: 'phone', url: 'https://wa.me/528331025832' }
            ];

            const handleFormSubmit = (e) => {
                e.preventDefault();
                setShowSuccess(true);
                setTimeout(() => setShowSuccess(false), 3000);
                setFormData({ name: '', service: '', contact: '' });
            };

            return (
                <div className="min-h-screen">
                    <nav className="fixed top-0 w-full z-50 bg-black/90 backdrop-blur-md border-b border-white/10">
                        <div className="max-w-6xl mx-auto px-6 h-20 flex justify-between items-center">
                            <div className="flex items-center space-x-4 cursor-pointer" onClick={() => setActiveTab('inicio')}>
                                <img src="logo denoka.png" alt="DENOKA" className="h-10 w-auto object-contain" />
                                <span className="text-xl font-light tracking-[0.3em] hidden sm:block">DENOKA</span>
                            </div>
                            <div className="flex space-x-6 text-[10px] uppercase tracking-widest font-medium">
                                {['inicio', 'servicios', 'contacto'].map((item) => (
                                    <button 
                                        key={item} 
                                        onClick={() => setActiveTab(item)}
                                        className={`${activeTab === item ? 'text-white border-b border-white' : 'text-gray-500'} hover:text-white pb-1 transition-all`}
                                    >
                                        {item}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    <main className="pt-20">
                        {activeTab === 'inicio' && (
                            <section className="min-h-[85vh] flex flex-col justify-center items-center px-6 text-center animate-fade-in">
                                <img src="logo denoka.png" alt="DENOKA" className="w-48 h-48 md:w-64 md:h-64 mb-8 opacity-90" />
                                <h1 className="text-4xl md:text-6xl font-extralight tracking-tighter mb-4 uppercase">DENOKA <span className="block italic text-2xl md:text-3xl mt-2 tracking-normal opacity-60">Films & Design</span></h1>
                                <p className="text-gray-400 max-w-lg text-lg font-light mb-10">Tampico, Tamps. Elevando marcas a través de la narrativa visual y el diseño minimalista.</p>
                                <div className="flex flex-col md:flex-row gap-4">
                                    <button onClick={() => setActiveTab('servicios')} className="px-10 py-4 bg-white text-black text-xs font-bold uppercase tracking-widest hover:bg-gray-200 transition-all flex items-center justify-center">Explorar Servicios <Icon name="chevronRight" className="w-4 h-4 ml-2"/></button>
                                    <button onClick={() => setActiveTab('contacto')} className="px-10 py-4 border border-white/20 text-white text-xs font-bold uppercase tracking-widest hover:bg-white/10 transition-all">Contacto</button>
                                </div>
                            </section>
                        )}

                        {activeTab === 'servicios' && (
                            <section className="max-w-6xl mx-auto px-6 py-16 animate-fade-in">
                                <h2 className="text-2xl font-light tracking-[0.2em] mb-12 text-center uppercase">Lo que hacemos</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {services.map((s) => (
                                        <div key={s.id} className="p-8 border border-white/5 bg-white/[0.02] hover:bg-white/[0.05] transition-all">
                                            <Icon name={s.icon} className="w-8 h-8 mb-6 text-gray-400" />
                                            <h3 className="text-xl font-medium mb-4">{s.title}</h3>
                                            <p className="text-gray-400 text-sm mb-6 leading-relaxed">{s.description}</p>
                                            <ul className="space-y-2">
                                                {s.features.map((f, i) => (
                                                    <li key={i} className="flex items-center text-[10px] text-gray-500 uppercase tracking-widest">
                                                        <Icon name="arrowRight" className="w-3 h-3 mr-2 opacity-30" /> {f}
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        )}

                        {activeTab === 'contacto' && (
                            <section className="max-w-6xl mx-auto px-6 py-16 animate-fade-in">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-16">
                                    <div>
                                        <h2 className="text-2xl font-light tracking-widest mb-8 uppercase">Hablemos de tu proyecto</h2>
                                        <form onSubmit={handleFormSubmit} className="space-y-6">
                                            <div>
                                                <label className="text-[10px] uppercase tracking-widest text-gray-500 mb-2 block">Nombre / Empresa</label>
                                                <input type="text" required className="w-full bg-white/5 border-b border-white/10 p-3 focus:outline-none focus:border-white transition-colors" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="text-[10px] uppercase tracking-widest text-gray-500 mb-2 block">Servicio</label>
                                                <select className="w-full bg-white/5 border-b border-white/10 p-3 focus:outline-none focus:border-white text-white" value={formData.service} onChange={(e) => setFormData({...formData, service: e.target.value})}>
                                                    <option value="">Seleccionar...</option>
                                                    <option value="identidad">Identidad de Marca</option>
                                                    <option value="audiovisual">Audiovisual</option>
                                                    <option value="eventos">Sociales</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[10px] uppercase tracking-widest text-gray-500 mb-2 block">WhatsApp o Correo</label>
                                                <input type="text" required className="w-full bg-white/5 border-b border-white/10 p-3 focus:outline-none focus:border-white transition-colors" value={formData.contact} onChange={(e) => setFormData({...formData, contact: e.target.value})} />
                                            </div>
                                            <button type="submit" className="w-full py-4 bg-white text-black text-xs font-bold uppercase tracking-widest hover:bg-gray-200 transition-all flex justify-center items-center">
                                                Enviar Mensaje <Icon name="send" className="w-4 h-4 ml-2" />
                                            </button>
                                            {showSuccess && <div className="text-green-500 text-sm flex items-center font-bold"><Icon name="check" className="w-4 h-4 mr-2"/>¡Recibido! Nos vemos en la expo.</div>}
                                        </form>
                                    </div>
                                    <div className="flex flex-col justify-center space-y-12">
                                        <div>
                                            <h3 className="text-[10px] uppercase tracking-widest text-gray-600 mb-4 font-bold">Contacto Directo</h3>
                                            <div className="space-y-4">
                                                <p className="text-lg flex items-center"><Icon name="phone" className="w-5 h-5 mr-3 opacity-40"/> +52 833 102 5832</p>
                                                <p className="text-lg flex items-center"><Icon name="mail" className="w-5 h-5 mr-3 opacity-40"/> denokamx@gmail.com</p>
                                            </div>
                                        </div>
                                        <div>
                                            <h3 className="text-[10px] uppercase tracking-widest text-gray-600 mb-4 font-bold">Redes</h3>
                                            <div className="flex gap-4">
                                                {socialLinks.map(link => (
                                                    <a key={link.name} href={link.url} target="_blank" className="p-3 border border-white/10 hover:bg-white hover:text-black transition-all">
                                                        <Icon name={link.icon} className="w-5 h-5" />
                                                    </a>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}
                    </main>

                    <footer className="py-12 border-t border-white/5 mt-10 px-6 opacity-30 text-center">
                        <p className="text-[10px] uppercase tracking-[0.4em]">DENOKA © 2024 | TAMPICO</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
